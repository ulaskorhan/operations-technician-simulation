---
# A Service gives the pods one stable address and spreads traffic across them.
# NodePort opens the same port on the node, so it can be reached from the lab network:
#   curl http://192.168.100.41:30080/
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ops-lab
spec:
  type: NodePort
  selector:
    app: web                  # send traffic to pods with this label
  ports:
    - port: 80                # port inside the cluster
      targetPort: 80          # port on the container
      nodePort: 30080         # port on OPS-LNX02 (allowed range 30000-32767)
