# Lab inventory. TODO: change 192.168.100 to your lab subnet (see docs/lab-setup.md).
#
# OPS-LNX01 is the Ansible control node, so it manages itself with a local connection
# (no SSH to itself). control_node=true lets playbooks treat it differently (for example: no automatic reboot).

[web]
ops-lnx01 ansible_host=192.168.100.40 ansible_connection=local control_node=true
ops-lnx02 ansible_host=192.168.100.41

[k8s]
ops-lnx02

# "linux" is a group of groups: every Ubuntu server in the lab.
[linux:children]
web
k8s
