# Ansible configuration for the lab. Ansible reads ansible.cfg from the current folder,
# so always run ansible commands from inside this ansible/ folder.

[defaults]
# Where the list of hosts is.
inventory = inventory.ini
# The user Ansible logs in as over SSH. TODO: change to your admin username on the Ubuntu servers.
remote_user = ulas
# Check SSH host keys (safer). The first SSH login by hand adds them to known_hosts.
host_key_checking = True
# Do not leave .retry files around after a failed run.
retry_files_enabled = False
# Pick the right Python on the target without printing a warning.
interpreter_python = auto_silent
# Print task results as readable YAML instead of one long JSON line.
callback_result_format = yaml

[privilege_escalation]
# Playbooks that need root say "become: true" themselves. Add -K to type the sudo password.
become = False
become_method = sudo
