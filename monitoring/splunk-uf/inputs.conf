# inputs.conf - what the Universal Forwarder reads on OPS-LNX01 and OPS-LNX02.
# Install to: /opt/splunkforwarder/etc/apps/ops_lab_inputs/local/inputs.conf
#
# The "linux" index must exist on SPLUNK01 first (Settings > Indexes > New Index).

# General system log: services, cron, kernel, and the ops-healthcheck script.
[monitor:///var/log/syslog]
index = linux
sourcetype = syslog
disabled = false

# Logins, sudo and SSH. linux_secure is the standard Splunk sourcetype for this file.
[monitor:///var/log/auth.log]
index = linux
sourcetype = linux_secure
disabled = false
