# outputs.conf - where the Universal Forwarder sends the data.
# Install to: /opt/splunkforwarder/etc/apps/ops_lab_inputs/local/outputs.conf
# TODO: change 192.168.100 to your lab subnet.

[tcpout]
defaultGroup = splunk01

[tcpout:splunk01]
# SPLUNK01 is already set up to receive on TCP 9997.
server = 192.168.100.20:9997
